<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}}</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a2e;
    --muted: #6b7280;
    --border: #e5e7eb;
    --surface: #f9fafb;
    --accent: #3b82f6;
    --green: #16a34a;
    --blue: #2563eb;
    --gray: #9ca3af;
    --yellow: #d97706;
    --red: #dc2626;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.6;
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  h1 { font-size: 1.875rem; margin-bottom: 0.5rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; }
  h2 { font-size: 1.5rem; margin-top: 2rem; margin-bottom: 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }
  h3 { font-size: 1.25rem; margin-top: 1.5rem; margin-bottom: 0.5rem; }
  h4 { font-size: 1.1rem; margin-top: 1.25rem; margin-bottom: 0.25rem; }
  h5, h6 { font-size: 1rem; margin-top: 1rem; margin-bottom: 0.25rem; }

  p { margin: 0.5rem 0; }
  ul, ol { margin: 0.5rem 0 0.5rem 1.5rem; }
  li { margin: 0.25rem 0; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .metadata { color: var(--muted); font-size: 0.875rem; margin-bottom: 0.75rem; }

  .badge {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.125rem 0.5rem;
    border-radius: 9999px;
    color: #fff;
    margin-right: 0.25rem;
  }
  .badge-done { background: var(--green); }
  .badge-active, .badge-in_progress, .badge-planned { background: var(--blue); }
  .badge-draft, .badge-on_hold { background: var(--gray); }
  .badge-blocked { background: var(--red); }

  .priority-critical { color: var(--red); font-weight: 600; }
  .priority-high { color: var(--yellow); font-weight: 600; }
  .priority-medium { color: var(--muted); }
  .priority-low { color: var(--gray); }

  pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
    overflow-x: auto;
    margin: 0.75rem 0;
    font-size: 0.875rem;
    line-height: 1.5;
  }
  code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.875em;
  }
  p code, li code {
    background: var(--surface);
    padding: 0.125rem 0.375rem;
    border-radius: 3px;
    border: 1px solid var(--border);
  }
  pre code { background: none; border: none; padding: 0; }

  .checklist { list-style: none; margin-left: 0; padding-left: 0; }
  .checklist li { padding-left: 1.5rem; position: relative; }
  .checklist li::before { content: "☐"; position: absolute; left: 0; color: var(--muted); }

  details {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem 1rem;
    margin: 0.5rem 0;
    background: var(--surface);
  }
  details summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--fg);
  }
  details summary:hover { color: var(--accent); }
  details > *:not(summary) { margin-top: 0.5rem; }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1.5rem 0;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.75rem 0;
    font-size: 0.875rem;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 0.5rem 0.75rem;
    text-align: left;
  }
  th { background: var(--surface); font-weight: 600; }

  .toc {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem 1.5rem;
    margin-bottom: 2rem;
  }
  .toc summary { font-weight: 600; cursor: pointer; }
  .toc ul { margin: 0.5rem 0 0 1rem; }
  .toc li { margin: 0.25rem 0; font-size: 0.875rem; }

  .section { margin-bottom: 1.5rem; }

  .footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }

  .mermaid {
    display: flex;
    justify-content: center;
    margin: 1rem 0;
  }

  @media print {
    body { max-width: 100%; padding: 0; }
    .toc { display: none; }
    .badge { border: 1px solid #000; color: #000; background: none; }
    details { border-color: #000; }
    pre { border-color: #ccc; }
    a { color: #000; }
    h1, h2 { border-color: #000; }
  }
</style>
</head>
<body>

{{.Content}}

<div class="footer">
  Generated by specflow &middot; {{.Date}}
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>mermaid.initialize({startOnLoad: true, theme: 'default'});</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
<script>
document.querySelectorAll('pre code:not(.language-mermaid)').forEach(el => hljs.highlightElement(el));
</script>
</body>
</html>
